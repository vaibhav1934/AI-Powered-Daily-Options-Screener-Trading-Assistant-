[project]
name = "options-screener-backend"
version = "1.0.0"
description = "StockGlass AI — Institutional Options & Stock Screener Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Validation & serialization
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    
    # AI — Anthropic SDK (native, no LangChain)
    "anthropic>=0.30.0",

    # HTTP client for market data APIs and direct LLM REST calls
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.38",

    # Scheduling
    "apscheduler>=3.10.0",

    # Timezone handling
    "pytz>=2024.1",

    # Structured logging
    "structlog>=24.1.0",

    # Storage (Supabase)
    "supabase>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx",       # For TestClient
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
